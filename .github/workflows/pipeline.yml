name: Pipeline [build -> deploy]

on:
  push:
    branches:
      - main

env:
  node_version_file: ".nvmrc"
  npm_version: "^11"
  install_command: "npm ci --no-audit"
  artifact_path: |
      public/

jobs:
  node-build:
    name: Run the node build
    runs-on: ubuntu-latest
    environment:
      name: prod
      deployment: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ env.node_version_file }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ env.node_version_file }}
      - name: update npm
        shell: bash
        run: |
          npm install -g "npm@${{ env.npm_version }}"
      - name: restore cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: node-modules
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**') }}
      - name: install dependencies
        if: steps.restore-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash -lc "${{ env.install_command }}"
      - name: build npm
        shell: bash
        run: |
          npm run build
      - name: upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm_build_artifacts
          path: "${{ env.artifact_path }}"
      - name: save cache
        id: save-cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          cache-name: node-modules
        with:
          path: |
            ./node_modules
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json', '!**/node_modules/**') }}
      - name: Upload to S3
        run: |
          aws s3 sync ./public s3://${{ secrets.BUCKET_NAME }}

